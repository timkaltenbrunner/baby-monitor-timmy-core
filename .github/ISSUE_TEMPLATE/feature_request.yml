name: Feature request
description: Suggest an improvement that fits the repo's public security scope.
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What review, verification, or developer pain point would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the change you would like to see.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope fit
      description: Explain why this belongs in the public security core rather than the private app repo.
