name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  dart-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install package dependencies
        working-directory: packages/baby_monitor_timmy_core
        run: flutter pub get

      - name: Analyze Dart package
        working-directory: packages/baby_monitor_timmy_core
        run: flutter analyze

      - name: Run Dart package tests
        working-directory: packages/baby_monitor_timmy_core
        run: flutter test

  functions-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Functions dependencies
        working-directory: functions
        run: npm ci

      - name: Lint Functions entrypoints
        working-directory: functions
        run: npm run lint

      - name: Run Functions unit tests
        working-directory: functions
        run: npm run test:unit

  firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Functions dependencies
        working-directory: functions
        run: npm ci

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Run Firestore rules tests
        working-directory: functions
        run: firebase emulators:exec --project demo-timmy-core "npm run test:rules"
